<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - SkyDrive</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 40px;
            font-size: 2.5rem;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5rem;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        button {
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background: #764ba2;
        }

        button.danger {
            background: #dc3545;
        }

        button.danger:hover {
            background: #c82333;
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
            display: none;
        }

        .loader.show {
            display: block;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .status {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            display: none;
        }

        .status.show {
            display: block;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
        }

        .status.info {
            background: #d1ecf1;
            color: #0c5460;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        thead {
            background: #f8f9fa;
        }

        th {
            padding: 12px;
            text-align: left;
            font-weight: 600;
            color: #333;
            border-bottom: 2px solid #e0e0e0;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #e0e0e0;
            color: #666;
        }

        tbody tr:hover {
            background: #f8f9fa;
        }

        .hash {
            font-family: monospace;
            font-size: 0.85rem;
            color: #888;
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 0.85rem;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            border-radius: 8px;
            color: white;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .stat-label {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .back-link {
            display: inline-block;
            color: white;
            text-decoration: none;
            margin-bottom: 20px;
            font-size: 1rem;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .bulk-actions {
            display: none;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
            padding: 12px;
            background: #f8f9fa;
            border-radius: 8px;
        }

        .bulk-actions.show {
            display: flex;
        }

        .bulk-actions .count {
            color: #667eea;
            font-weight: 600;
        }

        tbody tr.selected {
            background: #e7f3ff !important;
        }

        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-link">← Back to Home</a>
        <h1>🔧 Admin Dashboard</h1>

        <div class="stats" id="stats">
            <div class="stat-card">
                <div class="stat-value" id="totalFiles">-</div>
                <div class="stat-label">Total Files</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalSize">-</div>
                <div class="stat-label">Total Size</div>
            </div>
        </div>

        <div class="card">
            <div class="controls">
                <h2 style="margin: 0;">All Files</h2>
                <button onclick="refreshFiles()">🔄 Refresh</button>
            </div>

            <div class="bulk-actions" id="bulkActions">
                <span class="count"><span id="selectedCount">0</span> selected</span>
                <button class="danger" onclick="deleteSelected()">🗑️ Delete Selected</button>
                <button onclick="clearSelection()">Clear Selection</button>
            </div>

            <div class="loader" id="loader"></div>
            <div class="status" id="status"></div>

            <div id="tableContainer"></div>
        </div>
    </div>

    <script>
        const loader = document.getElementById('loader');
        const status = document.getElementById('status');
        const tableContainer = document.getElementById('tableContainer');
        const totalFilesEl = document.getElementById('totalFiles');
        const totalSizeEl = document.getElementById('totalSize');
        const bulkActions = document.getElementById('bulkActions');
        const selectedCountEl = document.getElementById('selectedCount');

        let selectedFiles = new Set();

        async function refreshFiles() {
            loader.classList.add('show');
            status.className = 'status';
            tableContainer.innerHTML = '';
            selectedFiles.clear();
            updateBulkActions();

            try {
                const response = await fetch('/api/admin/files');
                const result = await response.json();

                loader.classList.remove('show');

                if (response.ok) {
                    displayFiles(result.files);
                    updateStats(result.files);
                } else {
                    showStatus('error', `Error: ${result.error || 'Failed to load files'}`);
                }
            } catch (error) {
                loader.classList.remove('show');
                showStatus('error', `Error: ${error.message}`);
            }
        }

        function updateStats(files) {
            totalFilesEl.textContent = files.length;
            const totalBytes = files.reduce((sum, file) => sum + (file.size || 0), 0);
            totalSizeEl.textContent = formatSize(totalBytes);
        }

        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(2) + ' KB';
            if (bytes < 1024 * 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
            return (bytes / (1024 * 1024 * 1024)).toFixed(2) + ' GB';
        }

        function displayFiles(files) {
            if (files.length === 0) {
                tableContainer.innerHTML = '<div class="empty-state">No files found</div>';
                return;
            }

            const table = document.createElement('table');
            table.innerHTML = `
                <thead>
                    <tr>
                        <th><input type="checkbox" id="selectAll" onchange="toggleSelectAll(this)"></th>
                        <th>Filename</th>
                        <th>Type</th>
                        <th>Size</th>
                        <th>SHA-256</th>
                        <th>Uploaded</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    ${files.map(file => `
                        <tr id="file-${file.id}" class="${selectedFiles.has(file.id) ? 'selected' : ''}">
                            <td><input type="checkbox" class="file-checkbox" data-file-id="${file.id}" data-filename="${file.filename}" onchange="toggleFileSelection(this)" ${selectedFiles.has(file.id) ? 'checked' : ''}></td>
                            <td><strong>${file.filename}</strong></td>
                            <td>${file.file_type || file.content_type || 'Unknown'}</td>
                            <td>${formatSize(file.size)}</td>
                            <td class="hash">${file.sha256_hash.substring(0, 16)}...</td>
                            <td>${new Date(file.created_at).toLocaleString()}</td>
                            <td class="actions">
                                <button class="btn-small" onclick="viewFile('${file.id}')">👁️ View</button>
                                <button class="btn-small danger" onclick="deleteFile('${file.id}', '${file.filename}')">🗑️ Delete</button>
                            </td>
                        </tr>
                    `).join('')}
                </tbody>
            `;
            tableContainer.appendChild(table);
        }

        async function deleteFile(fileId, filename) {
            if (!confirm(`Are you sure you want to delete "${filename}"?\n\nThis will remove the file from both R2 and D1.`)) {
                return;
            }

            const row = document.getElementById(`file-${fileId}`);
            if (row) {
                row.style.opacity = '0.5';
            }

            try {
                const response = await fetch(`/api/admin/files/${fileId}`, {
                    method: 'DELETE'
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    // Show success with warnings if any
                    if (result.warnings && result.warnings.length > 0) {
                        showStatus('info', `File "${filename}" deleted with warnings: ${result.warnings.join(', ')}`);
                    } else {
                        showStatus('success', `File "${filename}" deleted successfully`);
                    }

                    if (row) {
                        row.remove();
                    }
                    // Update stats
                    const remainingFiles = Array.from(document.querySelectorAll('tbody tr')).length;
                    totalFilesEl.textContent = remainingFiles;
                    if (remainingFiles === 0) {
                        tableContainer.innerHTML = '<div class="empty-state">No files found</div>';
                    }
                } else {
                    const errorMsg = result.error || 'Failed to delete file';
                    const details = result.details ? ` (R2: ${result.details.r2Status}, D1: ${result.details.d1Status})` : '';
                    showStatus('error', `Error deleting "${filename}": ${errorMsg}${details}`);
                    if (row) {
                        row.style.opacity = '1';
                    }
                }
            } catch (error) {
                showStatus('error', `Error deleting "${filename}": ${error.message}`);
                if (row) {
                    row.style.opacity = '1';
                }
            }
        }

        function viewFile(fileId) {
            // Create a simple modal to view file details
            alert('View file details - Feature coming soon!\n\nFile ID: ' + fileId);
        }

        function showStatus(type, message) {
            status.className = `status ${type} show`;
            status.textContent = message;
            setTimeout(() => {
                status.classList.remove('show');
            }, 5000);
        }

        function toggleFileSelection(checkbox) {
            const fileId = checkbox.dataset.fileId;
            const row = document.getElementById(`file-${fileId}`);

            if (checkbox.checked) {
                selectedFiles.add(fileId);
                row.classList.add('selected');
            } else {
                selectedFiles.delete(fileId);
                row.classList.remove('selected');
            }

            updateBulkActions();
            updateSelectAllCheckbox();
        }

        function toggleSelectAll(checkbox) {
            const checkboxes = document.querySelectorAll('.file-checkbox');
            checkboxes.forEach(cb => {
                cb.checked = checkbox.checked;
                const fileId = cb.dataset.fileId;
                const row = document.getElementById(`file-${fileId}`);

                if (checkbox.checked) {
                    selectedFiles.add(fileId);
                    row.classList.add('selected');
                } else {
                    selectedFiles.delete(fileId);
                    row.classList.remove('selected');
                }
            });

            updateBulkActions();
        }

        function updateSelectAllCheckbox() {
            const selectAllCheckbox = document.getElementById('selectAll');
            const checkboxes = document.querySelectorAll('.file-checkbox');
            const allChecked = checkboxes.length > 0 && Array.from(checkboxes).every(cb => cb.checked);
            if (selectAllCheckbox) {
                selectAllCheckbox.checked = allChecked;
            }
        }

        function updateBulkActions() {
            selectedCountEl.textContent = selectedFiles.size;
            if (selectedFiles.size > 0) {
                bulkActions.classList.add('show');
            } else {
                bulkActions.classList.remove('show');
            }
        }

        function clearSelection() {
            selectedFiles.clear();
            document.querySelectorAll('.file-checkbox').forEach(cb => cb.checked = false);
            document.querySelectorAll('tbody tr').forEach(row => row.classList.remove('selected'));
            updateBulkActions();
            updateSelectAllCheckbox();
        }

        async function deleteSelected() {
            if (selectedFiles.size === 0) return;

            const count = selectedFiles.size;
            if (!confirm(`Are you sure you want to delete ${count} file(s)?\n\nThis will remove the files from both R2 and D1.`)) {
                return;
            }

            const fileIds = Array.from(selectedFiles);
            let successCount = 0;
            let failCount = 0;
            let warningCount = 0;
            const errorDetails = [];

            for (const fileId of fileIds) {
                const row = document.getElementById(`file-${fileId}`);
                if (row) row.style.opacity = '0.5';

                try {
                    const response = await fetch(`/api/admin/files/${fileId}`, {
                        method: 'DELETE'
                    });

                    const result = await response.json();

                    if (response.ok && result.success) {
                        successCount++;
                        if (result.warnings && result.warnings.length > 0) {
                            warningCount++;
                        }
                        if (row) row.remove();
                        selectedFiles.delete(fileId);
                    } else {
                        failCount++;
                        const checkbox = document.querySelector(`.file-checkbox[data-file-id="${fileId}"]`);
                        const filename = checkbox ? checkbox.dataset.filename : fileId;
                        errorDetails.push(`${filename}: ${result.error || 'Unknown error'}`);
                        if (row) row.style.opacity = '1';
                    }
                } catch (error) {
                    failCount++;
                    const checkbox = document.querySelector(`.file-checkbox[data-file-id="${fileId}"]`);
                    const filename = checkbox ? checkbox.dataset.filename : fileId;
                    errorDetails.push(`${filename}: ${error.message}`);
                    if (row) row.style.opacity = '1';
                }
            }

            // Update UI
            updateBulkActions();
            const remainingFiles = Array.from(document.querySelectorAll('tbody tr')).length;
            totalFilesEl.textContent = remainingFiles;

            if (remainingFiles === 0) {
                tableContainer.innerHTML = '<div class="empty-state">No files found</div>';
            }

            // Show detailed result
            if (failCount === 0 && warningCount === 0) {
                showStatus('success', `Successfully deleted ${successCount} file(s)`);
            } else if (failCount === 0 && warningCount > 0) {
                showStatus('info', `Deleted ${successCount} file(s) with ${warningCount} warnings (files may not have been in R2)`);
            } else {
                const errorList = errorDetails.slice(0, 3).join('; ');
                const more = errorDetails.length > 3 ? ` and ${errorDetails.length - 3} more` : '';
                showStatus('error', `Deleted ${successCount} file(s), ${failCount} failed: ${errorList}${more}`);
            }
        }

        // Load files on page load
        refreshFiles();
    </script>
</body>
</html>
